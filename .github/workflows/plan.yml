name: PR to main
on: 
  pull_request:
    branches:
      - main
jobs:
  terraform:
    name: terraform CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      TF_VAR_iac_github_token: ${{secrets.IAC_GITHUB_TOKEN}}
    steps:
      - uses: actions/checkout@v3
      - uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: |
          terraform init

      - name: Terraform Plan
        run: |
          terraform plan